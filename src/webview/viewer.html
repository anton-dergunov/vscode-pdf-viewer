<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'none'; 
                 script-src 'nonce-{{nonce}}' {{cspSource}}; 
                 style-src 'nonce-{{nonce}}' {{cspSource}} 'unsafe-inline'; 
                 img-src data: blob: {{cspSource}}; 
                 connect-src {{cspSource}} blob: data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer Pro</title>
  <link rel="stylesheet" nonce="{{nonce}}" href="{{viewerCssUri}}">
</head>
<body class="theme-auto">

  <!-- Top Floating Master Toolbar -->
  <div id="toolbar">
    <div class="toolbar-section left">
      <span id="doc-title" class="doc-title">PDF Document</span>
    </div>

    <div class="toolbar-section center">
      <!-- Navigation -->
      <div class="btn-group">
        <button id="btn-prev" class="btn" title="Previous Page">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="page-indicator">
          <input type="number" id="page-num-input" value="1" min="1">
          <span>/ <span id="page-count">0</span></span>
        </div>
        <button id="btn-next" class="btn" title="Next Page">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>

      <div class="divider"></div>

      <!-- Zoom -->
      <div class="btn-group">
        <button id="btn-zoom-out" class="btn" title="Zoom Out">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13H5v-2h14v2z"/></svg>
        </button>
        <select id="zoom-select" class="select-input">
          <option value="auto">Auto</option>
          <option value="page-fit">Page Fit</option>
          <option value="page-width">Page Width</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1.0" selected>100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2.0">200%</option>
        </select>
        <button id="btn-zoom-in" class="btn" title="Zoom In">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
      </div>

      <div class="divider"></div>

      <!-- Highlighting Tools -->
      <div class="btn-group highlight-tools">
        <button class="btn tool-btn active" data-tool="select" title="Text Selection Mode">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h2V3c-1.1 0-2 .9-2 2zm0 8h2v-2H3v2zm4 8h2v-2H7v2zM3 9h2V7H3v2zm10-6h-2v2h2V3zm6 0v2h2c0-1.1-.9-2-2-2zM5 21v-2H3c0 1.1.9 2 2 2zm-2-4h2v-2H3v2zM9 3h2v2H9V3zm11 4h2V5h-2v2zm0 4h2V9h-2v2zm0 4h2v-2h-2v2zm-4 4h2v-2h-2v2zm-4 0h2v-2h-2v2z"/></svg>
        </button>
        <button class="btn tool-btn" data-tool="highlight" title="Highlight Tool">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5zM4 20h16v2H4v-2z"/></svg>
        </button>

        <div class="color-picker" id="color-picker">
          <div class="color-dot active" data-color="#ffeb3b" style="background-color: #ffeb3b;" title="Yellow"></div>
          <div class="color-dot" data-color="#4caf50" style="background-color: #4caf50;" title="Green"></div>
          <div class="color-dot" data-color="#e91e63" style="background-color: #e91e63;" title="Pink"></div>
          <div class="color-dot" data-color="#03a9f4" style="background-color: #03a9f4;" title="Blue"></div>
          <div class="color-dot" data-color="#f44336" style="background-color: #f44336;" title="Red"></div>
        </div>

        <button class="btn tool-btn" data-tool="eraser" title="Eraser Tool (Click highlight to delete)">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20H2v-2l9.17-9.17-6.59-6.59c-.78-.78-.78-2.05 0-2.83l2.83-2.83c.79-.78 2.05-.78 2.83 0l6 6zm-7.07 7.07L4.59 15H10l4.59-4.37-5.42-5.42z"/></svg>
        </button>
      </div>
    </div>

    <div class="toolbar-section right">
      <button id="btn-search-toggle" class="btn" title="Find in PDF (Ctrl+F)">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <button id="btn-theme" class="btn" title="Toggle Reader Theme">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <button id="btn-save" class="btn btn-save" title="Save Highlights to Sidecar JSON">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
        <span>Save</span>
      </button>
    </div>
  </div>

  <!-- Search Panel Overlay -->
  <div id="search-bar" class="search-bar hidden">
    <input type="text" id="search-input" placeholder="Find text in document...">
    <span id="search-results-count" class="search-count">0 / 0</span>
    <button id="btn-search-prev" class="btn sm" title="Previous match">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
    </button>
    <button id="btn-search-next" class="btn sm" title="Next match">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
    </button>
    <button id="btn-search-close" class="btn sm" title="Close Search">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <!-- Loading Screen -->
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading PDF Document...</div>
  </div>

  <!-- Pages Viewport Container -->
  <div id="pages-container" class="pages-container"></div>

  <!-- PDF.js Engine Script -->
  <script nonce="{{nonce}}" src="{{pdfJsUri}}"></script>
  <!-- Custom Webview Controller -->
  <script nonce="{{nonce}}" src="{{viewerJsUri}}"></script>
</body>
</html>
